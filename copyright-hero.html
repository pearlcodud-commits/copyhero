<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>COPYRIGHT HERO : 저작권 수호 작전</title>
<style>
:root{--pu:#7b5cff;--pu2:#4a2bd0;--co:#2f5bff;--co2:#1a3cc0;--mi:#2fe0b8;--mi2:#12a585;--pk:#ff5fae;--pk2:#cf3a86;--ye:#ffd23f;--ye2:#cf9a00;--ink:#251c5c;--soft:#f4f1ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
html{font-size:clamp(14px,1.45vw,21px)}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;color:var(--ink);background:#2a1f7a;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:filter 1.5s}
.sky{position:absolute;inset:0;background:radial-gradient(ellipse at 15% 8%,#ff8fd0aa 0,transparent 40%),radial-gradient(ellipse at 88% 18%,#5ff5d299 0,transparent 35%),linear-gradient(180deg,#3a1fa8 0%,#3f55ff 55%,#7b5cff 100%)}
#bg svg.city{position:absolute;left:0;bottom:0;width:100%;height:60%}
.floater{position:absolute;font-size:2.6rem;opacity:.55;animation:float 9s ease-in-out infinite;filter:drop-shadow(0 .4rem .6rem #0003)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-34px) rotate(8deg)}}
#hud{position:relative;z-index:5;display:flex;align-items:center;gap:.55rem;padding:.45rem .8rem;background:rgba(22,14,66,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border-bottom:2px solid #ffffff22;min-height:4rem}
#hud.hidden{display:none}
.hud-av{width:3.1rem;height:3.1rem;border-radius:50%;background:#ffffff2a;display:grid;place-items:center;overflow:hidden;flex:none;border:2px solid #fff6}
.hud-av svg{width:3.4rem;height:3.6rem;margin-top:.5rem}
.hud-name{font-weight:900;line-height:1.15;font-size:1rem;white-space:nowrap}
.hud-name small{display:block;font-size:.72rem;color:var(--mi);font-weight:800}
.lv{background:linear-gradient(180deg,#ffe36e,#ffb800);color:#5a3a00;font-weight:900;border-radius:.8rem;padding:.15rem .55rem;box-shadow:0 .2rem 0 #b87d00;white-space:nowrap}
.xpwrap{flex:0 1 8rem;min-width:4rem}
.xpbar{height:.85rem;background:#ffffff26;border-radius:1rem;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mi),var(--ye));border-radius:1rem;transition:width .7s}
.xptxt{font-size:.66rem;opacity:.8;font-weight:700;text-align:center}
.pill{background:#ffffff1f;border-radius:1rem;padding:.3rem .65rem;font-weight:900;white-space:nowrap;font-size:.95rem}
.pill.combo{background:linear-gradient(90deg,#ff7a3d,#ff3d7f)}
.hud-sp{flex:1}
.hbtn{width:2.9rem;height:2.9rem;border-radius:.9rem;border:0;background:#ffffff26;color:#fff;font-size:1.25rem;box-shadow:0 .25rem 0 #0005;cursor:pointer;flex:none}
.hbtn:active{transform:translateY(.2rem);box-shadow:none}
.hbtn.on{background:var(--mi2)}
#screen{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#fx{position:fixed;inset:0;pointer-events:none;z-index:900;overflow:hidden}
.pt{position:absolute;width:12px;height:12px;border-radius:3px;margin:-6px 0 0 -6px;font-size:1.4rem;line-height:1}
.combo-pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-weight:900;color:#fff;-webkit-text-stroke:2px #c2185b;text-shadow:0 .3rem 0 #c2185b,0 .6rem 1rem #0005;z-index:950;pointer-events:none;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:990;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none}
.toast{background:#1d1748ee;color:#fff;padding:.8rem 1.4rem;border-radius:1.2rem;font-weight:800;font-size:1.1rem;box-shadow:0 .5rem 1.2rem #0005;animation:pop .35s both}
#modal{position:fixed;inset:0;z-index:980;display:none;align-items:center;justify-content:center;background:#120c3acc;padding:1rem}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:2rem;padding:1.6rem;max-width:min(44rem,94vw);max-height:90vh;overflow:auto;box-shadow:0 1rem 3rem #0008;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both;text-align:center}
.mbox h2{margin:.2rem 0 .8rem;font-size:1.8rem}
.mrow{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
#rotate{display:none;position:fixed;top:.5rem;left:50%;transform:translateX(-50%);z-index:999;background:var(--ye);color:#5a3a00;border-radius:1rem;padding:.4rem 1rem;font-weight:900;pointer-events:none}
@media (orientation:portrait) and (max-width:900px){#rotate{display:block;animation:fadeout 1s 5s forwards}}
@keyframes fadeout{to{opacity:0}}
/* buttons */
.btn{--c1:#9b82ff;--c2:#6a48ff;--sh:#4527c9;font-weight:900;font-size:1.15rem;border:0;border-radius:1.1rem;padding:.75rem 1.4rem;min-height:3.4rem;color:#fff;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 .42rem 0 var(--sh),0 .8rem 1.2rem rgba(0,0,0,.22);cursor:pointer;transition:transform .07s,box-shadow .07s,filter .2s;position:relative;text-shadow:0 .1rem 0 #0003;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(.36rem);box-shadow:0 .06rem 0 var(--sh),0 .2rem .4rem rgba(0,0,0,.25)}
.btn:disabled{filter:grayscale(.8);opacity:.55;cursor:default}
.btn.mint{--c1:#6bf7d7;--c2:#1fcaa2;--sh:#0f8c70;color:#063d31;text-shadow:none}
.btn.pink{--c1:#ff8ac4;--c2:#ff4f9f;--sh:#c22d78}
.btn.yellow{--c1:#ffe46a;--c2:#ffc21a;--sh:#c48c00;color:#5a3a00;text-shadow:none}
.btn.blue{--c1:#5d86ff;--c2:#2f5bff;--sh:#1a3cc0}
.btn.ghost{--c1:#ffffff;--c2:#ece8ff;--sh:#b5abe8;color:var(--ink);text-shadow:none}
.btn.red{--c1:#ff8d8d;--c2:#ff5757;--sh:#c23434}
.btn.sm{font-size:1rem;min-height:2.8rem;padding:.5rem 1rem}
.btn.big{font-size:1.45rem;min-height:4.2rem;padding:.9rem 2.2rem;border-radius:1.4rem}
.btn.huge{font-size:2.2rem;min-height:5.2rem;padding:1rem 3.4rem;border-radius:1.8rem}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15) drop-shadow(0 0 .8rem #fff8)}}
/* anim */
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.in{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}
.screen-in{animation:slideIn .45s ease both}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.shake{animation:shake .45s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.wig{animation:wig 1s ease-in-out infinite}
@keyframes runin{from{transform:translateX(220px);opacity:0}to{transform:none;opacity:1}}
.runin{animation:runin .9s ease-out both}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 6s linear infinite}
/* layout */
.wrapc{max-width:1200px;margin:0 auto;padding:1rem 1.2rem 3rem}
.panel{background:#fff;border-radius:1.6rem;box-shadow:0 .5rem 0 #0000001a,0 1rem 2rem #0003;padding:1.2rem}
.mission{min-height:100%}
.mtop{display:flex;align-items:center;gap:.8rem;padding:.7rem 1.2rem;max-width:1200px;margin:0 auto}
.mtitle{color:#fff;font-weight:900;font-size:1.25rem;text-shadow:0 .15rem 0 #0004;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{flex:1;display:flex;gap:.35rem;justify-content:flex-end;flex-wrap:wrap}
.dots i{width:1.05rem;height:1.05rem;border-radius:50%;background:#ffffff40;display:block}
.dots i.done{background:var(--mi)}
.dots i.now{background:var(--ye);box-shadow:0 0 0 .25rem #ffd23f55;transform:scale(1.2)}
.stage{max-width:1200px;margin:0 auto 2rem;padding:1.4rem 1.6rem 2rem;background:#fbfaff;border-radius:2rem;box-shadow:0 1rem 2.4rem #0004;width:calc(100% - 2rem)}
.stage.clear{background:transparent;box-shadow:none;padding:.5rem}
.qhead{display:flex;align-items:flex-start;gap:.8rem;margin-bottom:1.1rem}
.qtext{flex:1;font-size:1.5rem;font-weight:900;line-height:1.45;word-break:keep-all}
.say{display:inline-flex;gap:.35rem;flex:none;vertical-align:middle}
.sbtn{width:2.9rem;height:2.9rem;border-radius:50%;border:0;background:linear-gradient(180deg,#8f7bff,#5d3ff0);color:#fff;font-size:1.2rem;box-shadow:0 .25rem 0 #3c22b5;cursor:pointer;touch-action:manipulation}
.sbtn:active{transform:translateY(.2rem);box-shadow:none}
.sbtn.slow{background:linear-gradient(180deg,#6bf7d7,#1fcaa2);box-shadow:0 .25rem 0 #0f8c70}
.nextrow{display:flex;justify-content:center;margin-top:1.4rem}
.fb{display:none;margin-top:1rem;padding:.9rem 1.2rem;border-radius:1.2rem;font-size:1.25rem;font-weight:800;align-items:center;gap:.7rem;line-height:1.5;word-break:keep-all}
.fb.show{display:flex;animation:pop .35s both}
.fb>span:first-child{flex:1}
.fb.ok{background:#e1fff6;color:#0a6450;border:3px solid var(--mi)}
.fb.no{background:#fff5d9;color:#7a5200;border:3px solid var(--ye)}
/* dialog */
.dlg{display:grid;grid-template-columns:minmax(9rem,22%) 1fr;gap:1rem;align-items:end}
.dwho svg{width:100%;max-height:16rem;filter:drop-shadow(0 .6rem .8rem #0004)}
.bubble{background:#fff;border-radius:1.8rem;padding:1.2rem 1.5rem;position:relative;box-shadow:0 .5rem 0 #0000001a,0 1rem 2rem #0003;margin-bottom:2rem}
.bubble:before{content:"";position:absolute;left:-1rem;bottom:2rem;border:1rem solid transparent;border-right-color:#fff;border-left:0}
.bname{display:inline-block;background:var(--pu);color:#fff;font-weight:900;border-radius:1rem;padding:.2rem .8rem;margin-bottom:.5rem}
.btext{font-size:1.55rem;font-weight:800;line-height:1.55;min-height:4.5rem;word-break:keep-all}
.brow{display:flex;justify-content:space-between;align-items:center;margin-top:.8rem;gap:1rem}
.scene{min-height:13rem;border-radius:2rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#ffffffd9,#efeaffd9);box-shadow:inset 0 0 0 4px #ffffff88;overflow:hidden;position:relative}
.sc{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap;padding:1rem;width:100%;min-height:13rem;position:relative}
.sc.night{background:linear-gradient(180deg,#1b1450,#3a2a9a);border-radius:2rem;color:#fff}
.sc.gray{filter:grayscale(1);background:#cfcfd8;border-radius:2rem}
.sc.colorful{background:linear-gradient(120deg,#ffe3f1,#e0fff7,#fff5c9);border-radius:2rem}
.e{font-size:3.6rem;display:inline-block;animation:pop .5s both;animation-delay:var(--d,0s)}
.e.big{font-size:5.4rem}
.sc .bub{background:#fff;color:var(--ink);border-radius:1.2rem;padding:.6rem 1rem;font-weight:900;font-size:1.3rem;box-shadow:0 .3rem 0 #0002;animation:pop .5s .4s both}
.sc .tag{position:absolute;top:1rem;left:1.2rem;font-weight:900;color:#fff;background:#0006;border-radius:1rem;padding:.2rem .8rem}
.shieldc{width:7rem;height:7rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b0,#ffc21a);display:grid;place-items:center;font-size:4.5rem;font-weight:900;color:#5a3be6;box-shadow:0 0 0 .6rem #ffd23f66,0 0 3rem #ffd23f;animation:pop .6s .3s both}
.arrow{font-size:2.5rem;font-weight:900;color:var(--pu)}
/* options */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.9rem}
.opt{background:#fff;color:var(--ink);border-radius:1.2rem;padding:.9rem 1.1rem;font-size:1.22rem;font-weight:800;box-shadow:0 .4rem 0 #c9c2f0,0 .6rem 1rem #0001;display:flex;gap:.8rem;align-items:center;min-height:4.6rem;border:3px solid #e6e1ff;text-align:left;cursor:pointer;line-height:1.4;word-break:keep-all;touch-action:manipulation;transition:transform .07s}
.opt:active:not(:disabled){transform:translateY(.3rem);box-shadow:0 .1rem 0 #c9c2f0}
.opt .ic{font-size:2.2rem;flex:none}
.opt.ok{border-color:var(--mi);background:#e1fff6;box-shadow:0 .4rem 0 var(--mi2)}
.opt.no{border-color:#ff9a9a;background:#fff0f0;opacity:.75;animation:shake .45s}
.opt:disabled{cursor:default}
.opts.big .opt{flex-direction:column;text-align:center;justify-content:center;min-height:9rem}
.opts.big .opt .ic{font-size:3.4rem}
.qpic{display:flex;justify-content:center;gap:1rem;padding:1rem;border-radius:1.5rem;background:var(--soft);margin-bottom:1rem;flex-wrap:wrap}
/* hint */
.hintbox{margin-top:1rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
.hint{background:#fffbe6;border:3px dashed var(--ye);border-radius:1rem;padding:.6rem 1rem;font-size:1.15rem;font-weight:700;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;word-break:keep-all}
.hint .hpic{font-size:2.4rem}
/* drag */
.pile{position:sticky;top:.4rem;z-index:4;box-shadow:0 .4rem 1rem #0002;display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;padding:1rem;border-radius:1.4rem;background:var(--soft);min-height:5rem;margin-bottom:1rem}
.card{background:#fff;border-radius:1rem;padding:.65rem 1rem;font-weight:800;font-size:1.18rem;box-shadow:0 .38rem 0 #c9c2f0,0 .5rem .8rem #0001;touch-action:none;cursor:grab;min-height:3.4rem;display:flex;align-items:center;gap:.5rem;border:3px solid #e6e1ff;word-break:keep-all;line-height:1.35}
.card .ic{font-size:1.7rem}
.card.sel{border-color:var(--ye);box-shadow:0 0 0 .3rem #ffd23f88,0 .38rem 0 #c9c2f0;transform:translateY(-.2rem)}
.card.placed{cursor:default;border-color:var(--mi);background:#effffa;box-shadow:0 .2rem 0 var(--mi2)}
.dragghost{position:fixed!important;z-index:1000;pointer-events:none;transform:scale(1.08) rotate(-3deg);box-shadow:0 1.2rem 2rem rgba(0,0,0,.35)!important;margin:0!important;opacity:.95}
.placeholder{opacity:.25}
.drop.over{outline:4px dashed var(--ye);outline-offset:3px;filter:brightness(1.05)}
.syl{width:4.4rem;height:5.2rem;justify-content:center;font-size:2.2rem;padding:0}
.wcard{font-size:1.5rem;padding:.6rem 1.3rem}
.slot{min-width:4.4rem;height:5.2rem;border:3px dashed #b2a6f2;border-radius:1rem;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;background:#f6f4ff;margin:0 .15rem;font-size:2.2rem;font-weight:900;color:var(--pu2);padding:0 .3rem}
.slot.wslot{min-width:7rem}
.slot.filled{border:3px solid var(--mi);background:#e1fff6;animation:pop .35s both}
.sents{display:flex;flex-direction:column;gap:.9rem}
.sent.solved{box-shadow:0 0 0 4px var(--mi),0 .8rem 1.4rem #0002}
.srow{display:flex;align-items:center;gap:.8rem;justify-content:space-between}
.sline{font-size:1.5rem;font-weight:800;line-height:2.4;word-break:keep-all}
.mean{color:#6b62a8;font-weight:700;margin-top:.3rem}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.bin{min-height:12rem;border-radius:1.5rem;padding:1rem;border:4px dashed #ffffffcc;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.5rem;box-shadow:inset 0 0 0 2px #0001}
.binlbl{width:100%;font-weight:900;font-size:1.3rem;color:#fff;text-shadow:0 .15rem 0 #0003;margin-bottom:.3rem}
.oslots{display:flex;flex-direction:column;gap:.6rem}
.oslot{display:flex;align-items:center;gap:.7rem;min-height:4.2rem;border:3px dashed #b2a6f2;border-radius:1.1rem;padding:.4rem;background:#f8f6ff}
.onum{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--pu);color:#fff;font-weight:900;display:grid;place-items:center;flex:none;font-size:1.2rem}
/* tap grid */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.9rem}
.tile{background:#fff;border:3px solid #e6e1ff;border-radius:1.3rem;padding:1rem .6rem;box-shadow:0 .4rem 0 #c9c2f0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.4rem;touch-action:manipulation;word-break:keep-all}
.tile:active{transform:translateY(.3rem);box-shadow:0 .1rem 0 #c9c2f0}
.tile .ti{font-size:3rem}
.tile .tt{font-size:1.12rem;font-weight:800;line-height:1.35;text-align:center}
.tile.found{border-color:var(--mi);background:#e1fff6;box-shadow:0 .4rem 0 var(--mi2);animation:pop .4s both}
.tile.found:after{content:"✔";position:absolute}
.tile.nope{animation:shake .45s;border-color:#ff9a9a}
.tcount{font-weight:900;font-size:1.2rem;color:var(--pu2);margin-bottom:.7rem}
/* write */
.write{width:100%;font-size:1.5rem;font-weight:700;border:4px solid #c9c2f0;border-radius:1.3rem;padding:1rem 1.2rem;min-height:8rem;resize:vertical;color:var(--ink);background:#fffef8;line-height:1.6;outline:none}
.write:focus{border-color:var(--pu)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.chip{border:0;background:#ece7ff;color:var(--pu2);font-weight:800;font-size:1.05rem;border-radius:2rem;padding:.55rem 1rem;box-shadow:0 .25rem 0 #c9bff5;cursor:pointer;touch-action:manipulation}
.chip:active{transform:translateY(.2rem);box-shadow:none}
.chip.on{background:var(--mi);color:#063d31;box-shadow:0 .25rem 0 var(--mi2)}
.example{background:#eef6ff;border-left:.5rem solid var(--co);border-radius:1rem;padding:.7rem 1rem;font-weight:700;margin-bottom:.8rem;font-size:1.1rem}
.wbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:.8rem;flex-wrap:wrap}
.cnt{font-weight:800;color:#8a82bf}
/* worlds */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.door{border:0;border-radius:2rem;padding:1.4rem;min-height:13rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;font-weight:900;box-shadow:0 .6rem 0 #0003;touch-action:manipulation;position:relative}
.door:active{transform:translateY(.4rem);box-shadow:0 .1rem 0 #0003}
.door.wa{background:linear-gradient(140deg,#ff9fd2,#ffe46a,#6bf7d7);color:#3d1d6b}
.door.wb{background:linear-gradient(140deg,#8d8a99,#c5c3cf);color:#2f2d38}
.door .dicon{font-size:4rem}
.door .dname{font-size:1.35rem}
.door .dstate{background:#fff9;border-radius:1rem;padding:.25rem .9rem;font-size:1rem}
.door.visited .dstate{background:var(--mi);color:#063d31}
.wview{display:none;margin-top:1.2rem;border-radius:2rem;padding:1.3rem;text-align:center}
.wview.show{display:block;animation:pop .45s both}
.wview.wa{background:linear-gradient(140deg,#fff0f8,#fffbe0,#e6fff8)}
.wview.wb{background:#e3e2e8}
.wview.wb .wpic{filter:grayscale(1) brightness(.9)}
.wtitle{font-weight:900;font-size:1.3rem;margin-bottom:.5rem}
.wpic{font-size:1rem;min-height:8rem;display:flex;align-items:center;justify-content:center;gap:.6rem}
.wpic .e{font-size:5rem}
.wcaprow{display:flex;align-items:center;justify-content:center;gap:.8rem;margin:.6rem 0}
.wcap{font-size:1.5rem;font-weight:900;word-break:keep-all}
.wdots{color:var(--pu);font-size:1.1rem;margin-bottom:.6rem;letter-spacing:.2rem}
.ctable{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem}
.ctable>div{border-radius:1.4rem;padding:1rem 1.2rem;font-weight:800;font-size:1.12rem;line-height:1.8}
.ctable h4{margin:0 0 .4rem;font-size:1.25rem}
/* case */
.casehead{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem;font-size:1.5rem}
.casetag{background:linear-gradient(90deg,var(--pk),var(--pu));color:#fff;font-weight:900;padding:.3rem 1rem;border-radius:1rem;font-size:1.1rem}
.comic{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}

 fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const s=t+i*dur;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.015);g.gain.exponentialRampToValueAtTime(.0001,s+dur*1.6);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur*1.8);});}catch(e){}}
const SFX={tap:()=>tone([700],.05,'triangle',.035),good:()=>tone([660,880,1175],.08,'triangle',.06),bad:()=>tone([330,247],.12,'sine',.045),coin:()=>tone([1320,1760],.05,'square',.025),win:()=>tone([523,659,784,1047,1319],.1,'triangle',.07),hit:()=>tone([180,110],.09,'sawtooth',.04),lv:()=>tone([523,784,1047,1568],.09,'triangle',.07)};

if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice;}
const cleanT=t=>String(t).replace(/<[^>]+>/g,'').replace(/\p{Extended_Pictographic}|️|‍/gu,'').replace(/[「」©]/g,'').replace(/_{2,}|\[ *\]/g,' 빈칸 ').trim();
function speak(t,slow){if(!t)return;lastSay=t;if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cleanT(t));u.lang='ko-KR';u.rate=slow?0.62:(S.slow?0.78:1);u.pitch=1.08;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u);}catch(e){}}

 for(let i=0;i<n;i++){const p=h('span',{class:'pt'},chars?pick(chars):'');if(!chars)p.style.background=pick(cols);else{p.style.background='none';p.style.width='auto';}
  p.style.left=x+'px';p.style.top=y+'px';fx.append(p);const a=Math.random()*Math.PI*2,d=60+Math.random()*160;
  const an=p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+50}px) scale(.4) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:700+Math.random()*600,easing:'cubic-bezier(.2,.8,.3,1)'});an.onfinish=()=>p.remove();}}

 c.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${(tx-x)/2}px,${(ty-y)/2-80}px) scale(1.3)`},{transform:`translate(${tx-x}px,${ty-y}px) scale(.6)`}],{duration:750,easing:'ease-in-out'}).onfinish=()=>{c.remove();SFX.coin();tgt.animate([{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:250});};}

let SEL=null;
function dropAt(x,y){const els=document.elementsFromPoint(x,y);for(const e of els){const d=e.closest&&e.closest('.drop');if(d)return d;}return null;}
function makeDrop(zone,fn){zone.classList.add('drop');zone._accept=fn;zone.addEventListener('click',()=>{if(SEL&&document.body.contains(SEL)&&!SEL.dataset.locked){const c=SEL;SEL.classList.remove('sel');SEL=null;fn(zone,c);}});}
function draggable(el){el.addEventListener('pointerdown',e=>{if(el.dataset.locked||(e.button&&e.button>0))return;e.preventDefault();const r=el.getBoundingClientRect();const sx=e.clientX,sy=e.clientY;let moved=false,ghost=null,over=null,lastX=sx,lastY=sy;const scr=$('#screen');const auto=setInterval(()=>{if(!moved)return;const H=innerHeight;let d=0;if(lastY>H-90)d=14;else if(lastY<140)d=-14;if(d){scr.scrollTop+=d;const t=dropAt(lastX,lastY);if(t!==over){over&&over.classList.remove('over');over=t;over&&over.classList.add('over');}}},30);
 try{el.setPointerCapture(e.pointerId);}catch(_){}
 const move=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.hypot(dx,dy)>8){moved=true;ghost=el.cloneNode(true);ghost.classList.add('dragghost');ghost.classList.remove('sel');Object.assign(ghost.style,{width:r.width+'px',height:r.height+'px',left:r.left+'px',top:r.top+'px'});document.body.append(ghost);el.classList.add('placeholder');if(SEL){SEL.classList.remove('sel');SEL=null;}SFX.tap();}
  if(moved){lastY=ev.clientY;lastX=ev.clientX;ghost.style.left=(r.left+dx)+'px';ghost.style.top=(r.top+dy)+'px';const t=dropAt(ev.clientX,ev.clientY);if(t!==over){over&&over.classList.remove('over');over=t;over&&over.classList.add('over');}}};
 const up=ev=>{clearInterval(auto);el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);over&&over.classList.remove('over');
  if(moved){const t=ev.type==='pointercancel'?null:dropAt(ev.clientX,ev.clientY);ghost.remove();el.classList.remove('placeholder');if(t&&t._accept)t._accept(t,el);}
  else{if(SEL===el){el.classList.remove('sel');SEL=null;}else{SEL&&SEL.classList.remove('sel');SEL=el;el.classList.add('sel');SFX.tap();toast('👉 이제 놓을 곳을 터치하세요');}}};
 el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);});}
